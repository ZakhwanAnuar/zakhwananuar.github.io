  <style>
    .ctf-events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 8px;
    }
    .ctf-event-card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .ctf-event-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .ctf-event-card:hover {
      border-color: var(--border-2);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      color: inherit;
    }
    .ctf-event-card:hover::before { opacity: 1; }
    .ctf-event-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .ctf-event-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: var(--accent-dim);
      border: 1px solid rgba(0,217,255,0.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .ctf-event-count-badge {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(0,217,255,0.15);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .ctf-event-name {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin: 0;
    }
    .ctf-event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .ctf-tag {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid;
    }
    .ctf-tag-year { color:#ffd32a; background:rgba(255,211,42,0.1); border-color:rgba(255,211,42,0.2); }
    .ctf-tag-type { color:#a78bfa; background:rgba(124,58,237,0.12); border-color:rgba(124,58,237,0.2); }
    .ctf-tag-intl { color:#00ff88; background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.2); }
    .ctf-event-categories { display: flex; flex-wrap: wrap; gap: 6px; }
    .ctf-event-cat-pill {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .ctf-event-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .ctf-event-arrow {
      color: var(--text-3);
      font-size: 0.8rem;
      transition: transform 0.2s, color 0.2s;
    }
    .ctf-event-card:hover .ctf-event-arrow { transform: translateX(4px); color: var(--accent); }
    .ctf-event-challenge-count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-3); }
    .tag-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .tag-filter-btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: none;
      color: var(--text-2);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-filter-btn:hover, .tag-filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .no-results { padding: 60px 40px; text-align: center; color: var(--text-3); font-size: 0.88rem; grid-column: 1 / -1; }
    .no-results i { font-size: 2rem; margin-bottom: 16px; display: block; }
    .writeups-stats {
      display: flex;
      gap: 28px;
      margin-bottom: 32px;
      padding: 16px 24px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-value { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-family: var(--font-mono); font-size: 0.63rem; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
