<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .event-header-card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }
    .event-header-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .event-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .event-title-block { flex: 1; }
    .event-name {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 10px;
      line-height: 1.2;
    }
    .event-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .event-tag {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid;
    }
    .event-tag-year { color:#ffd32a; background:rgba(255,211,42,0.1); border-color:rgba(255,211,42,0.2); }
    .event-tag-type { color:#a78bfa; background:rgba(124,58,237,0.12); border-color:rgba(124,58,237,0.2); }
    .event-tag-intl { color:#00ff88; background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.2); }
    .event-stat-row {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .event-stat { display: flex; flex-direction: column; gap: 2px; }
    .event-stat-val { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .event-stat-lbl { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }

    /* challenge list search + filter */
    .challenge-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .writeups-list { display: flex; flex-direction: column; gap: 14px; }
    .writeup-card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 26px;
      display: flex;
      align-items: center;
      gap: 22px;
      transition: all 0.22s ease;
      text-decoration: none;
      color: inherit;
    }
    .writeup-card:hover {
      border-color: var(--border-2);
      transform: translateX(4px);
      box-shadow: -4px 0 0 var(--accent);
      color: inherit;
    }
    .writeup-card-badge {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .writeup-category {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      min-width: 72px;
      text-align: center;
    }
    .cat-web       { background:rgba(0,217,255,0.15); color:#00d9ff; }
    .cat-crypto    { background:rgba(124,58,237,0.15); color:#a78bfa; }
    .cat-pwn       { background:rgba(255,71,87,0.2); color:#ff6b7a; }
    .cat-rev       { background:rgba(255,107,53,0.15); color:#ff9a72; }
    .cat-forensics { background:rgba(0,255,136,0.12); color:#00ff88; }
    .cat-misc      { background:rgba(255,211,42,0.15); color:#ffd32a; }
    .writeup-difficulty { font-size: 0.63rem; color: var(--text-3); font-family: var(--font-mono); }
    .writeup-card-body { flex: 1; }
    .writeup-card-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .writeup-card-meta { display: flex; align-items: center; gap: 12px; font-size: 0.73rem; color: var(--text-3); margin-bottom: 7px; font-family: var(--font-mono); }
    .writeup-card-summary { font-size: 0.82rem; color: var(--text-2); line-height: 1.6; }
    .writeup-card-arrow { color: var(--text-3); font-size: 0.8rem; transition: transform 0.2s, color 0.2s; flex-shrink: 0; }
    .writeup-card:hover .writeup-card-arrow { transform: translateX(4px); color: var(--accent); }

    .no-challenges { padding: 60px 40px; text-align: center; color: var(--text-3); font-size: 0.88rem; }
    .no-challenges i { font-size: 2rem; margin-bottom: 16px; display: block; }
  </style>
</head>

  <main class="main-content">
    <div class="container">

      <!-- Event header — filled by JS -->
      <div id="eventHeader"></div>

      <!-- Challenge controls -->
      <div class="challenge-controls">
        <div class="writeups-search">
          <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="challengeSearch" placeholder="Search challenges..." class="search-input" />
          </div>
        </div>
        <div class="filter-bar" id="categoryFilterBar">
